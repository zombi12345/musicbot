services:
  - type: web
    name: musicbot
    runtime: python
    buildCommand: pip install -r requirements.txt && apt-get update && apt-get install -y ffmpeg
    startCommand: gunicorn bot_prod:app --bind 0.0.0.0:$PORT --worker-class gthread --threads 4 --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FFMPEG_LOCATION
        value: /usr/bin/ffmpeg